name: Auto Contamination Scan

on:
  schedule:
    - cron: '0 2 * * *'  # 毎日JST 11:00
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図'
        required: false
        type: string

permissions:
  issues: write
  contents: write
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify FORK_ADMIN_PAT is valid
        env:
          GH_TOKEN: ${{ secrets.FORK_ADMIN_PAT }}
        run: |
          if ! USER=$(gh api user --jq '.login' 2>&1); then
            echo "::error::FORK_ADMIN_PAT が無効です。secretを更新してください: gh auth token | gh secret set FORK_ADMIN_PAT --repo yasumorishima/oss-contributions"
            exit 1
          fi
          echo "✅ FORK_ADMIN_PAT 有効 (user=$USER)"

      - name: Build fork list from config.json
        id: forks
        env:
          GH_TOKEN: ${{ secrets.FORK_ADMIN_PAT }}
        run: |
          # config.json の upstream 一覧からフォーク一覧を生成
          # upstream "dfinity/icp-js-core" → fork "yasumorishima/icp-js-core"
          # 削除済みで実在しないフォークは後続ステップが 404 で落ちるため除外する
          AUTHOR=$(jq -r '.author' config.json)
          MISSING_FILE=$(mktemp)
          : > /tmp/fork_list.txt

          while read -r upstream; do
            REPO_NAME=$(echo "$upstream" | cut -d/ -f2)
            FORK="$AUTHOR/$REPO_NAME"
            if gh api "repos/$FORK" --jq '.full_name' > /dev/null 2>&1; then
              echo "$FORK $upstream" >> /tmp/fork_list.txt
            else
              echo "::warning::MISSING FORK: $FORK が存在しない (upstream: $upstream) → スキャン対象から除外"
              echo "- ⚠️ \`$FORK\` が存在しない（config.json に \`$upstream\` が残っている。フォークし直すか config.json から削除）" >> "$MISSING_FILE"
            fi
          done < <(jq -r '.projects | keys[]' config.json)

          SCAN_COUNT=$(wc -l < /tmp/fork_list.txt)
          MISSING_COUNT=$(wc -l < "$MISSING_FILE")
          echo "ℹ️ スキャン対象 $SCAN_COUNT 件 / 実在しないフォーク $MISSING_COUNT 件を除外"
          cat /tmp/fork_list.txt

          if [ "$MISSING_COUNT" -gt 0 ]; then
            echo "fail=true" >> "$GITHUB_OUTPUT"
          else
            echo "fail=false" >> "$GITHUB_OUTPUT"
          fi
          echo "report_file=$MISSING_FILE" >> "$GITHUB_OUTPUT"

      - name: Auto-register unregistered forks in config.json
        id: unregistered
        env:
          GH_TOKEN: ${{ secrets.FORK_ADMIN_PAT }}
        run: |
          AUTHOR=$(jq -r '.author' config.json)
          REPORT_FILE=$(mktemp)
          FIXED_FILE=$(mktemp)
          FAIL=false
          FIXED_COUNT=0

          # config.json に登録済みのリポ名一覧
          jq -r '.projects | keys[]' config.json | cut -d/ -f2 | sort > /tmp/registered.txt

          # 実際の全フォーク一覧
          gh repo list "$AUTHOR" --fork --no-archived --limit 500 --json name --jq '.[].name' | sort > /tmp/actual_forks.txt

          # 差分 = config.json 未登録フォーク → 自動登録を試行
          while read REPO_NAME; do
            # フォーク元の upstream owner/repo を取得
            UPSTREAM_FULL=$(gh api "repos/$AUTHOR/$REPO_NAME" --jq '.parent.full_name' 2>/dev/null || echo "")
            if [ -z "$UPSTREAM_FULL" ]; then
              echo "::warning::UNREGISTERED: $AUTHOR/$REPO_NAME の upstream 取得失敗"
              echo "- ⚠️ \`$AUTHOR/$REPO_NAME\` が config.json に未登録（upstream取得失敗、手動対応が必要）" >> "$REPORT_FILE"
              FAIL=true
              continue
            fi

            # 言語と説明を取得
            REPO_INFO=$(gh api "repos/$UPSTREAM_FULL" --jq '{language: .language, description: .description}' 2>/dev/null || echo '{}')
            LANG=$(echo "$REPO_INFO" | jq -r '.language // "Unknown"')
            DESC=$(echo "$REPO_INFO" | jq -r '.description // ""')

            # config.json に追加（"Other" グループに自動分類）
            jq --arg key "$UPSTREAM_FULL" --arg lang "$LANG" --arg desc "$DESC" \
              '.projects[$key] = {language: $lang, description: $desc}' config.json > /tmp/config_tmp.json \
              && mv /tmp/config_tmp.json config.json

            echo "✅ AUTO-REGISTERED: $UPSTREAM_FULL (lang=$LANG)"
            echo "- ✅ \`$UPSTREAM_FULL\` を config.json に自動登録（Other グループ）" >> "$FIXED_FILE"
            FIXED_COUNT=$((FIXED_COUNT + 1))

            # gh repo list 由来＝実在が確認済みなので、そのままスキャン対象に追記する
            # （config.json 全体からの再生成は Build fork list の除外を打ち消す）
            echo "$AUTHOR/$REPO_NAME $UPSTREAM_FULL" >> /tmp/fork_list.txt
          done < <(comm -13 /tmp/registered.txt /tmp/actual_forks.txt)

          # 自動登録があればコミット
          if [ "$FIXED_COUNT" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add config.json
            git commit -m "auto: register $FIXED_COUNT new fork(s) in config.json"
            git push
            echo "📝 $FIXED_COUNT 件を config.json に自動登録＋コミットしました"
          fi

          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
          echo "fixed_file=$FIXED_FILE" >> "$GITHUB_OUTPUT"

      - name: Auto-delete fork-only files in fork default branches
        id: files
        env:
          GH_TOKEN: ${{ secrets.FORK_ADMIN_PAT }}
        run: |
          # FORBIDDEN_FILES: fork に置く意味がなく、置くと害になるファイル
          # - codeql.yml: CodeQL Default Setup と物理的に併存不可（SARIF upload エラー）
          # - .coderabbit.yaml: CodeRabbit GitHub App アカウント全体設定で代替
          FORBIDDEN_FILES=(".coderabbit.yaml" ".github/workflows/codeql.yml")
          REPORT_FILE=$(mktemp)
          FIXED_FILE=$(mktemp)
          FAIL=false
          FIXED_COUNT=0

          while read -r FORK UPSTREAM; do
            DEFAULT_BRANCH=$(gh api "repos/$FORK" --jq '.default_branch' 2>/dev/null || echo "")
            if [ -z "$DEFAULT_BRANCH" ]; then
              continue
            fi

            for f in "${FORBIDDEN_FILES[@]}"; do
              # ファイル存在確認 + sha 取得を1回の API call で
              FILE_INFO=$(gh api "repos/$FORK/contents/$f?ref=$DEFAULT_BRANCH" 2>/dev/null || echo "")
              SHA=$(echo "$FILE_INFO" | jq -r '.sha // empty' 2>/dev/null)
              if [ -n "$SHA" ]; then
                # 自動削除を試行（upstream 由来でも fork からは削除すべきが確定なので無条件）
                DELETE_RESULT=$(gh api "repos/$FORK/contents/$f" -X DELETE \
                  -f message="auto: remove $f from fork (CodeQL Default Setup / CodeRabbit App で代替)" \
                  -f sha="$SHA" \
                  -f branch="$DEFAULT_BRANCH" 2>&1) || true
                if echo "$DELETE_RESULT" | jq -e '.commit.sha' > /dev/null 2>&1; then
                  COMMIT=$(echo "$DELETE_RESULT" | jq -r '.commit.sha[0:7]')
                  echo "✅ AUTO-DELETED: $FORK ($DEFAULT_BRANCH) から $f を削除 (commit: $COMMIT)"
                  echo "- ✅ \`$FORK\` ($DEFAULT_BRANCH) から \`$f\` を自動削除 (commit: \`$COMMIT\`)" >> "$FIXED_FILE"
                  FIXED_COUNT=$((FIXED_COUNT + 1))
                else
                  echo "::error::DELETE FAILED: $FORK の $f 削除失敗: $DELETE_RESULT"
                  echo "- ⚠️ \`$FORK\` ($DEFAULT_BRANCH) の \`$f\` 自動削除に失敗（手動対応が必要）" >> "$REPORT_FILE"
                  FAIL=true
                fi
              fi
            done
          done < /tmp/fork_list.txt

          echo "ℹ️ FORBIDDEN_FILES 自動削除: $FIXED_COUNT 件成功"
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
          echo "fixed_file=$FIXED_FILE" >> "$GITHUB_OUTPUT"

      - name: Auto-enable CodeQL Default Setup on forks
        id: codeql
        env:
          GH_TOKEN: ${{ secrets.FORK_ADMIN_PAT }}
        run: |
          REPORT_FILE=$(mktemp)
          FIXED_FILE=$(mktemp)
          FAIL=false
          FIXED_COUNT=0

          while read -r FORK UPSTREAM; do
            STATE=$(gh api "repos/$FORK/code-scanning/default-setup" --jq '.state' 2>/dev/null || echo "error")
            if [ "$STATE" != "configured" ]; then
              echo "::notice::CODEQL: $FORK が未設定 (state=$STATE) → 自動有効化を試行"
              RESULT=$(gh api "repos/$FORK/code-scanning/default-setup" \
                -X PATCH -f state=configured 2>&1) || true
              if echo "$RESULT" | jq -e '.run_id' > /dev/null 2>&1; then
                RUN_ID=$(echo "$RESULT" | jq -r '.run_id')
                echo "✅ AUTO-ENABLED: $FORK (run_id=$RUN_ID)"
                echo "- ✅ \`$FORK\` の CodeQL Default Setup を自動有効化 (run_id: $RUN_ID)" >> "$FIXED_FILE"
                FIXED_COUNT=$((FIXED_COUNT + 1))
              else
                echo "::error::CODEQL: $FORK の自動有効化に失敗: $RESULT"
                echo "- ⚠️ \`$FORK\` の CodeQL Default Setup 自動有効化に失敗（手動対応が必要）" >> "$REPORT_FILE"
                FAIL=true
              fi
            fi
          done < /tmp/fork_list.txt

          echo "ℹ️ CodeQL 自動有効化: $FIXED_COUNT 件成功"
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
          echo "fixed_file=$FIXED_FILE" >> "$GITHUB_OUTPUT"

      - name: Detect active scheduled workflows on forks
        id: scheduled
        env:
          GH_TOKEN: ${{ secrets.FORK_ADMIN_PAT }}
        run: |
          AUTHOR=$(jq -r '.author' config.json)
          REPORT_FILE=$(mktemp)
          FAIL=false

          # config.json 登録フォーク + 未登録フォーク 両方をスキャン
          {
            # config.json 登録済み
            while read -r FORK UPSTREAM; do
              echo "$FORK"
            done < /tmp/fork_list.txt
            # 未登録フォーク
            gh repo list "$AUTHOR" --fork --no-archived --limit 500 --json name --jq ".[].name" | while read NAME; do
              echo "$AUTHOR/$NAME"
            done
          } | sort -u > /tmp/all_forks.txt

          while read -r FORK; do
            # 有効なワークフロー一覧を取得
            WORKFLOWS=$(gh api "repos/$FORK/actions/workflows" \
              --jq '.workflows[] | select(.state == "active") | "\(.id) \(.path)"' 2>/dev/null || echo "")
            [ -z "$WORKFLOWS" ] && continue

            DEFAULT_BRANCH=$(gh api "repos/$FORK" --jq '.default_branch' 2>/dev/null || echo "main")

            while IFS= read -r WF_LINE; do
              WF_ID=$(echo "$WF_LINE" | awk '{print $1}')
              WF_PATH=$(echo "$WF_LINE" | awk '{print $2}')
              [ -z "$WF_ID" ] && continue
              WF_FILE=$(basename "$WF_PATH")

              # ワークフローファイルの中身を取得して schedule トリガーを検出
              CONTENT=$(gh api "repos/$FORK/contents/$WF_PATH?ref=$DEFAULT_BRANCH" \
                --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")
              [ -z "$CONTENT" ] && continue

              if echo "$CONTENT" | grep -q "schedule:"; then
                CRON=$(echo "$CONTENT" | grep -A1 "schedule:" | grep "cron:" | head -1 | sed 's/.*cron: *//; s/[\"'"'"']//g; s/ *$//')
                echo "::warning::SCHEDULED: $FORK の $WF_FILE にスケジュール実行あり (cron: $CRON)"
                echo "- \`$FORK\` の \`$WF_FILE\` にスケジュール実行が有効 (cron: \`$CRON\`)" >> "$REPORT_FILE"
                FAIL=true
              fi
            done <<< "$WORKFLOWS"
          done < /tmp/all_forks.txt

          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

      - name: Scan open PRs for contamination
        id: prscan
        env:
          GH_TOKEN: ${{ secrets.FORK_ADMIN_PAT }}
        run: |
          FORBIDDEN_FILES=(".coderabbit.yaml" ".github/workflows/codeql.yml")
          REPORT_FILE=$(mktemp)
          FAIL=false
          AUTHOR=$(jq -r '.author' config.json)

          while read -r FORK UPSTREAM; do
            PRS=$(gh pr list \
              --repo "$UPSTREAM" \
              --state open \
              --json number,headRepositoryOwner \
              --jq ".[] | select(.headRepositoryOwner.login == \"$AUTHOR\") | .number" \
              2>/dev/null || echo "")

            for PR in $PRS; do
              FILES=$(gh pr view "$PR" \
                --repo "$UPSTREAM" \
                --json files \
                --jq '.files[].path' \
                2>/dev/null || echo "")

              for f in "${FORBIDDEN_FILES[@]}"; do
                if echo "$FILES" | grep -qxF "$f"; then
                  echo "::error::CONTAMINATION: $UPSTREAM PR #$PR に $f が混入"
                  echo "- \`$UPSTREAM\` PR #$PR に \`$f\` が混入" >> "$REPORT_FILE"
                  FAIL=true
                fi
              done
            done
          done < /tmp/fork_list.txt

          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

      - name: Create issue only for unfixed problems
        if: steps.forks.outputs.fail == 'true' || steps.unregistered.outputs.fail == 'true' || steps.files.outputs.fail == 'true' || steps.codeql.outputs.fail == 'true' || steps.scheduled.outputs.fail == 'true' || steps.prscan.outputs.fail == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="⚠️ [自動検知] 自動修復できない問題が検出されました"

          # 同タイトルのオープン Issue があればスキップ
          EXISTING=$(gh issue list \
            --repo yasumorishima/oss-contributions \
            --state open \
            --json title 2>/dev/null \
            | jq --arg t "$ISSUE_TITLE" '[.[] | select(.title == $t)] | length' 2>/dev/null || echo 0)
          if [ -z "$EXISTING" ]; then EXISTING=0; fi

          if [ "$EXISTING" -gt 0 ]; then
            echo "ℹ️ 既にオープン Issue あり。重複作成をスキップします"
            exit 0
          fi

          BODY_FILE=$(mktemp)
          echo "## ⚠️ 自動修復できない問題" > "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "以下の問題は自動修復に失敗したため、手動対応が必要です。" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"

          # 未修復の問題のみ（fail == true のステップのレポートファイル）
          for RF in "${{ steps.forks.outputs.report_file }}" "${{ steps.unregistered.outputs.report_file }}" "${{ steps.files.outputs.report_file }}" "${{ steps.codeql.outputs.report_file }}" "${{ steps.scheduled.outputs.report_file }}" "${{ steps.prscan.outputs.report_file }}"; do
            if [ -s "$RF" ]; then
              cat "$RF" >> "$BODY_FILE"
            fi
          done

          # 自動修復の実績があれば記載
          HAS_FIXED=false
          FIXED_SECTION=$(mktemp)
          echo "" >> "$FIXED_SECTION"
          echo "## ✅ 自動修復済み" >> "$FIXED_SECTION"
          echo "" >> "$FIXED_SECTION"
          for FF in "${{ steps.unregistered.outputs.fixed_file }}" "${{ steps.files.outputs.fixed_file }}" "${{ steps.codeql.outputs.fixed_file }}"; do
            if [ -s "$FF" ]; then
              cat "$FF" >> "$FIXED_SECTION"
              HAS_FIXED=true
            fi
          done
          if [ "$HAS_FIXED" = "true" ]; then
            cat "$FIXED_SECTION" >> "$BODY_FILE"
          fi

          echo "" >> "$BODY_FILE"
          echo "## ルール" >> "$BODY_FILE"
          echo "- 新規フォークは自動で config.json に登録される（Other グループ）" >> "$BODY_FILE"
          echo "- CodeQL Default Setup は自動で有効化される" >> "$BODY_FILE"
          echo "- \`.coderabbit.yaml\` / \`codeql.yml\` はフォークに置かない（Web UI / Default Setup で代替）" >> "$BODY_FILE"
          echo "- フォークのスケジュールワークフローは無効化する" >> "$BODY_FILE"
          echo "- feature ブランチは \`git checkout -b xxx upstream/main\` で切る" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "> このIssueは Auto Contamination Scan ワークフローにより自動作成されました" >> "$BODY_FILE"

          gh issue create \
            --repo yasumorishima/oss-contributions \
            --title "$ISSUE_TITLE" \
            --body-file "$BODY_FILE" \
            --label "bug"
