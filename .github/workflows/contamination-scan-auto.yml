name: Auto Contamination Scan

on:
  schedule:
    - cron: '0 2 * * *'  # 毎日JST 11:00
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図'
        required: false
        type: string

permissions:
  issues: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build fork list from config.json
        id: forks
        run: |
          # config.json の upstream 一覧からフォーク一覧を生成
          # upstream "dfinity/icp-js-core" → fork "yasumorishima/icp-js-core"
          AUTHOR=$(jq -r '.author' config.json)
          jq -r '.projects | keys[]' config.json | while read upstream; do
            REPO_NAME=$(echo "$upstream" | cut -d/ -f2)
            echo "$AUTHOR/$REPO_NAME $upstream"
          done > /tmp/fork_list.txt
          cat /tmp/fork_list.txt

      - name: Detect forks not registered in config.json
        id: unregistered
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTHOR=$(jq -r '.author' config.json)
          REPORT_FILE=$(mktemp)
          FAIL=false

          # config.json に登録済みのリポ名一覧
          jq -r '.projects | keys[]' config.json | while read upstream; do
            echo "$upstream" | cut -d/ -f2
          done | sort > /tmp/registered.txt

          # 実際の全フォーク一覧
          gh repo list "$AUTHOR" --fork --no-archived --json name --jq '.[].name' | sort > /tmp/actual_forks.txt

          # 差分 = config.json 未登録フォーク
          while read REPO_NAME; do
            echo "::warning::UNREGISTERED: $AUTHOR/$REPO_NAME が config.json に未登録"
            echo "- ⚠️ \`$AUTHOR/$REPO_NAME\` が config.json に未登録（追加が必要）" >> "$REPORT_FILE"
            FAIL=true
          done < <(comm -13 /tmp/registered.txt /tmp/actual_forks.txt)

          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

      - name: Check fork-only files in fork default branches
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORBIDDEN_FILES=(".coderabbit.yaml" ".github/workflows/codeql.yml")
          REPORT_FILE=$(mktemp)
          FAIL=false

          while read -r FORK UPSTREAM; do
            # フォークのデフォルトブランチを取得（main/master/develop 等）
            DEFAULT_BRANCH=$(gh api "repos/$FORK" --jq '.default_branch' 2>/dev/null || echo "")
            if [ -z "$DEFAULT_BRANCH" ]; then
              continue
            fi

            for f in "${FORBIDDEN_FILES[@]}"; do
              HTTP_CODE=$(gh api "repos/$FORK/contents/$f?ref=$DEFAULT_BRANCH" --jq '.name' -i 2>/dev/null | head -1 | awk '{print $2}')
              if [ "$HTTP_CODE" = "200" ]; then
                echo "::error::FORK FILE: $FORK ($DEFAULT_BRANCH) に $f が存在"
                echo "- ⚠️ \`$FORK\` ($DEFAULT_BRANCH) に \`$f\` が存在（削除が必要）" >> "$REPORT_FILE"
                FAIL=true
              fi
            done
          done < /tmp/fork_list.txt

          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

      - name: Check CodeQL Default Setup on forks
        id: codeql
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT_FILE=$(mktemp)
          FAIL=false

          while read -r FORK UPSTREAM; do
            STATE=$(gh api "repos/$FORK/code-scanning/default-setup" --jq '.state' 2>/dev/null || echo "error")
            if [ "$STATE" != "configured" ]; then
              echo "::warning::CODEQL: $FORK の CodeQL Default Setup が未設定 (state=$STATE)"
              echo "- ⚠️ \`$FORK\` の CodeQL Default Setup が未設定" >> "$REPORT_FILE"
              FAIL=true
            fi
          done < /tmp/fork_list.txt

          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

      - name: Detect active scheduled workflows on forks
        id: scheduled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTHOR=$(jq -r '.author' config.json)
          REPORT_FILE=$(mktemp)
          FAIL=false

          # config.json 登録フォーク + 未登録フォーク 両方をスキャン
          {
            # config.json 登録済み
            while read -r FORK UPSTREAM; do
              echo "$FORK"
            done < /tmp/fork_list.txt
            # 未登録フォーク
            gh repo list "$AUTHOR" --fork --no-archived --json name --jq ".[].name" | while read NAME; do
              echo "$AUTHOR/$NAME"
            done
          } | sort -u > /tmp/all_forks.txt

          while read -r FORK; do
            # 有効なワークフロー一覧を取得
            WORKFLOWS=$(gh api "repos/$FORK/actions/workflows" \
              --jq '.workflows[] | select(.state == "active") | "\(.id) \(.path)"' 2>/dev/null || echo "")
            [ -z "$WORKFLOWS" ] && continue

            DEFAULT_BRANCH=$(gh api "repos/$FORK" --jq '.default_branch' 2>/dev/null || echo "main")

            while IFS= read -r WF_LINE; do
              WF_ID=$(echo "$WF_LINE" | awk '{print $1}')
              WF_PATH=$(echo "$WF_LINE" | awk '{print $2}')
              [ -z "$WF_ID" ] && continue
              WF_FILE=$(basename "$WF_PATH")

              # ワークフローファイルの中身を取得して schedule トリガーを検出
              CONTENT=$(gh api "repos/$FORK/contents/$WF_PATH?ref=$DEFAULT_BRANCH" \
                --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")
              [ -z "$CONTENT" ] && continue

              if echo "$CONTENT" | grep -q "schedule:"; then
                CRON=$(echo "$CONTENT" | grep -A1 "schedule:" | grep "cron:" | head -1 | sed 's/.*cron: *//; s/[\"'"'"']//g; s/ *$//')
                echo "::warning::SCHEDULED: $FORK の $WF_FILE にスケジュール実行あり (cron: $CRON)"
                echo "- \`$FORK\` の \`$WF_FILE\` にスケジュール実行が有効 (cron: \`$CRON\`)" >> "$REPORT_FILE"
                FAIL=true
              fi
            done <<< "$WORKFLOWS"
          done < /tmp/all_forks.txt

          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

      - name: Scan open PRs for contamination
        id: prscan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORBIDDEN_FILES=(".coderabbit.yaml" ".github/workflows/codeql.yml")
          REPORT_FILE=$(mktemp)
          FAIL=false
          AUTHOR=$(jq -r '.author' config.json)

          while read -r FORK UPSTREAM; do
            PRS=$(gh pr list \
              --repo "$UPSTREAM" \
              --state open \
              --json number,headRepositoryOwner \
              --jq ".[] | select(.headRepositoryOwner.login == \"$AUTHOR\") | .number" \
              2>/dev/null || echo "")

            for PR in $PRS; do
              FILES=$(gh pr view "$PR" \
                --repo "$UPSTREAM" \
                --json files \
                --jq '.files[].path' \
                2>/dev/null || echo "")

              for f in "${FORBIDDEN_FILES[@]}"; do
                if echo "$FILES" | grep -qxF "$f"; then
                  echo "::error::CONTAMINATION: $UPSTREAM PR #$PR に $f が混入"
                  echo "- \`$UPSTREAM\` PR #$PR に \`$f\` が混入" >> "$REPORT_FILE"
                  FAIL=true
                fi
              done
            done
          done < /tmp/fork_list.txt

          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

      - name: Create issue if any problems found
        if: steps.unregistered.outputs.fail == 'true' || steps.files.outputs.fail == 'true' || steps.codeql.outputs.fail == 'true' || steps.scheduled.outputs.fail == 'true' || steps.prscan.outputs.fail == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="⚠️ [自動検知] フォーク設定の問題が検出されました"

          # 同タイトルのオープン Issue があればスキップ
          EXISTING=$(gh issue list \
            --repo yasumorishima/oss-contributions \
            --state open \
            --json title \
            | jq --arg t "$ISSUE_TITLE" '[.[] | select(.title == $t)] | length')

          if [ "$EXISTING" -gt 0 ]; then
            echo "ℹ️ 既にオープン Issue あり。重複作成をスキップします"
            exit 0
          fi

          BODY_FILE=$(mktemp)
          echo "## ⚠️ フォーク設定の問題を検出" > "$BODY_FILE"
          echo "" >> "$BODY_FILE"

          for RF in "${{ steps.unregistered.outputs.report_file }}" "${{ steps.files.outputs.report_file }}" "${{ steps.codeql.outputs.report_file }}" "${{ steps.scheduled.outputs.report_file }}" "${{ steps.prscan.outputs.report_file }}"; do
            if [ -s "$RF" ]; then
              cat "$RF" >> "$BODY_FILE"
            fi
          done

          echo "" >> "$BODY_FILE"
          echo "## ルール" >> "$BODY_FILE"
          echo "- 新規フォークは必ず config.json に登録する" >> "$BODY_FILE"
          echo "- \`.coderabbit.yaml\` / \`codeql.yml\` はフォークに置かない（Web UI / Default Setup で代替）" >> "$BODY_FILE"
          echo "- CodeQL Default Setup は各フォークで有効化必須" >> "$BODY_FILE"
          echo "- フォークのスケジュールワークフローは無効化する（\`gh workflow disable <name> --repo <fork>\`）" >> "$BODY_FILE"
          echo "- feature ブランチは \`git checkout -b xxx upstream/main\` で切る" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "> このIssueは Auto Contamination Scan ワークフローにより自動作成されました" >> "$BODY_FILE"

          gh issue create \
            --repo yasumorishima/oss-contributions \
            --title "$ISSUE_TITLE" \
            --body-file "$BODY_FILE" \
            --label "bug"
