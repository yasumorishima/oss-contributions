name: PyPI Version Check

on:
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図（必須）'
        required: true
        type: string
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check published versions
        run: |
          python3 - <<'EOF'
          import urllib.request, json, os

          PACKAGES = [
              ("savant-extras",          "https://github.com/yasumorishima/savant-extras"),
              ("baseball-field-viz",     "https://github.com/yasumorishima/baseball-field-viz"),
              ("kaggle-notebook-deploy", "https://github.com/yasumorishima/kaggle-notebook-deploy"),
              ("kaggle-wandb-sync",      "https://github.com/yasumorishima/kaggle-wandb-sync"),
              ("signate-deploy",         "https://github.com/yasumorishima/signate-deploy"),
              ("signate-wandb-sync",     "https://github.com/yasumorishima/signate-wandb-sync"),
          ]

          rows = []
          for pkg, repo in PACKAGES:
              try:
                  url = f"https://pypi.org/pypi/{pkg}/json"
                  with urllib.request.urlopen(url, timeout=10) as r:
                      data = json.load(r)
                  latest = data["info"]["version"]
                  all_versions = sorted(data["releases"].keys(), reverse=True)[:3]
                  rows.append(("✅", pkg, latest, ", ".join(all_versions), repo))
              except Exception as e:
                  rows.append(("❌", pkg, "error", str(e)[:40], repo))

          # stdout
          print("## PyPI Packages\n")
          print(f"  {'Package':<28} {'Latest':<10} Recent versions")
          print("  " + "-" * 65)
          for icon, pkg, latest, versions, repo in rows:
              print(f"  {icon} {pkg:<26} {latest:<10} {versions}")

          # GitHub Step Summary
          out = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(out, "a", encoding="utf-8") as f:
              f.write("## PyPI Packages\n\n")
              f.write("| | Package | Latest | Recent versions |\n|---|---|---|---|\n")
              for icon, pkg, latest, versions, repo in rows:
                  f.write(f"| {icon} | [{pkg}](https://pypi.org/project/{pkg}/) `{latest}` | [GitHub]({repo}) | {versions} |\n")
          EOF
