name: Delete Claude Branches

# Deletes claude/* branches listed by hand, with FORK_ADMIN_PAT.
# Cloud sessions can only push their own branch, so they run this instead.
on:
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図'
        required: true
        type: string
      branches:
        description: '消すブランチ。1 行に「repo branch」（例: mirai-gikai claude/foo）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete listed branches
        env:
          GH_TOKEN: ${{ secrets.FORK_ADMIN_PAT }}
          OWNER: yasumorishima
          BRANCHES: ${{ inputs.branches }}
        run: |
          fail=0
          while read -r repo branch extra; do
            [ -z "$repo" ] && continue
            if [ -z "$branch" ] || [ -n "$extra" ]; then
              echo "::error::書式が違います: $repo $branch $extra"; fail=1; continue
            fi
            case "$branch" in
              claude/*) ;;
              *) echo "::error::claude/* 以外は消しません: $repo $branch"; fail=1; continue ;;
            esac
            sha=$(gh api "repos/$OWNER/$repo/git/ref/heads/$branch" --jq .object.sha 2>/dev/null) || {
              echo "SKIP (もう無い): $repo $branch"; continue; }
            open=$(gh pr list --repo "$OWNER/$repo" --head "$branch" --state open --json number --jq length) || {
              echo "::error::PR を確認できません: $repo $branch"; fail=1; continue; }
            if [ "$open" != "0" ]; then
              echo "::error::オープン PR があるので残します: $repo $branch"; fail=1; continue
            fi
            if gh api -X DELETE "repos/$OWNER/$repo/git/refs/heads/$branch"; then
              echo "DELETED: $repo $branch (was $sha)"
            else
              echo "::error::削除失敗: $repo $branch"; fail=1
            fi
          done <<< "$BRANCHES"
          exit $fail
