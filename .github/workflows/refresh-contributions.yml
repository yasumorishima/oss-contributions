name: Refresh Contributions

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9:00 UTC
  workflow_dispatch:
    inputs:
      memo:
        description: 'Reason for manual run'
        required: false
        type: string

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh PR statuses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/record_pr.py --refresh

      - name: Write summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import re, os, subprocess, json
          from pathlib import Path
          from datetime import datetime, timezone

          readme = Path("README.md").read_text(encoding="utf-8")
          lines = readme.splitlines()

          # Extract summary table rows
          summary_rows = []
          in_summary = False
          for line in lines:
              if "| Project |" in line:
                  in_summary = True
              if in_summary:
                  summary_rows.append(line)
              if in_summary and "**Total**" in line:
                  break

          # Collect open PRs
          open_prs = []
          for line in lines:
              if "| Open |" in line:
                  m = re.search(r'\[#(\d+)\]\((https://github\.com/([^/]+/[^/]+)/pull/(\d+))\)', line)
                  desc_m = re.search(r'\| Open \| (.+?) \|', line)
                  if m:
                      open_prs.append({
                          "num": m.group(1),
                          "url": m.group(2),
                          "repo": m.group(3),
                          "pr": m.group(4),
                          "desc": desc_m.group(1).strip() if desc_m else ""
                      })

          def get_last_activity(repo, pr_num):
              try:
                  result = subprocess.run(
                      ["gh", "pr", "view", pr_num, "--repo", repo,
                       "--json", "updatedAt,comments,reviews",
                       "--jq", ".updatedAt"],
                      capture_output=True, text=True, timeout=30
                  )
                  if result.returncode == 0 and result.stdout.strip():
                      dt = datetime.fromisoformat(result.stdout.strip().replace("Z", "+00:00"))
                      return dt.strftime("%Y-%m-%d")
              except Exception:
                  pass
              return "unknown"

          for pr in open_prs:
              pr["last_update"] = get_last_activity(pr["repo"], pr["pr"])

          # stdout
          print("## OSS Contributions\n")
          for row in summary_rows:
              print(" ", row)
          print(f"\n### Open PRs ({len(open_prs)})")
          for pr in open_prs:
              print(f"  #{pr['num']}: {pr['desc']}  (last update: {pr['last_update']})  {pr['url']}")

          # GitHub Step Summary
          out = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(out, "a", encoding="utf-8") as f:
              f.write("## OSS Contributions\n\n")
              f.write("\n".join(summary_rows) + "\n\n")
              f.write(f"### Open PRs ({len(open_prs)})\n\n")
              if open_prs:
                  f.write("| PR | Description | Last Update |\n|---|---|---|\n")
                  for pr in open_prs:
                      f.write(f"| [#{pr['num']}]({pr['url']}) | {pr['desc']} | {pr['last_update']} |\n")
              else:
                  f.write("_No open PRs._\n")
          EOF

      - name: List open fork PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '### Open Fork PRs' >> $GITHUB_STEP_SUMMARY
          gh search prs --author yasumorishima --state open \
            --json repository,number,title,isDraft,url \
            --jq '.[] | select(.repository.nameWithOwner | startswith("yasumorishima/")) |
              "- [" + (if .isDraft then "Draft" else "Open" end) + "] " +
              .repository.nameWithOwner + "#" + (.number|tostring) + ": " + .title' \
            >> $GITHUB_STEP_SUMMARY \
            || echo '_No open fork PRs._' >> $GITHUB_STEP_SUMMARY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Auto-refresh PR statuses"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Sync totals to claude-config CLAUDE.md
        if: ${{ env.HAS_PAT == 'true' }}
        env:
          HAS_PAT: ${{ secrets.CLAUDE_CONFIG_PAT != '' }}
          GH_TOKEN: ${{ secrets.CLAUDE_CONFIG_PAT }}
        run: |
          TOTAL_LINE=$(grep '**Total**' README.md)
          TOTAL_PRS=$(echo "$TOTAL_LINE" | grep -oP '\*\*\K\d+(?=\*\*)' | head -1)
          TOTAL_MERGED=$(echo "$TOTAL_LINE" | grep -oP '\*\*\K\d+(?=\*\*)' | sed -n '2p')

          if [ -z "$TOTAL_PRS" ] || [ -z "$TOTAL_MERGED" ]; then
            echo "::warning::Failed to extract totals from README.md"
            exit 0
          fi
          echo "Extracted: ${TOTAL_PRS} PRs, ${TOTAL_MERGED} Merged"

          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/yasumorishima/claude-config.git /tmp/claude-config
          cd /tmp/claude-config

          sed -i -E "s|oss-contributions[0-9]+件[0-9]+ Merged|oss-contributions ${TOTAL_PRS}件 ${TOTAL_MERGED} Merged|g" CLAUDE.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync OSS totals: ${TOTAL_PRS} PRs, ${TOTAL_MERGED} Merged"
            git push
            echo "claude-config updated: ${TOTAL_PRS} PRs, ${TOTAL_MERGED} Merged"
          else
            echo "claude-config already up to date."
          fi

      - name: Sync stats to profile README
        if: ${{ env.HAS_PAT == 'true' }}
        env:
          HAS_PAT: ${{ secrets.CLAUDE_CONFIG_PAT != '' }}
          GH_TOKEN: ${{ secrets.CLAUDE_CONFIG_PAT }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/yasumorishima/yasumorishima.git /tmp/profile

          python scripts/sync_profile_readme.py /tmp/profile/README.md

          cd /tmp/profile
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m "Auto-sync OSS stats from oss-contributions"
            git push
            echo "Profile README updated."
          else
            echo "Profile README already up to date."
          fi
