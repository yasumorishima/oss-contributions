name: Refresh Contributions

on:
  schedule:
    - cron: '0 9 * * 1'  # 豈朱ｱ譛域屆 9:00 UTC
  workflow_dispatch:
    inputs:
      memo:
        description: '縺薙�螳溯｡後�諢丞峙'
        required: false
        type: string
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh PR statuses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/record_pr.py --refresh

      - name: Write summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import re, os, subprocess, json
          from pathlib import Path
          from datetime import datetime, timezone

          readme = Path("README.md").read_text(encoding="utf-8")
          lines = readme.splitlines()

          # 繧ｵ繝槭Μ繝ｼ繝��繝悶Ν謚ｽ蜃ｺ
          summary_rows = []
          in_summary = False
          for line in lines:
              if "| Project |" in line:
                  in_summary = True
              if in_summary:
                  summary_rows.append(line)
              if in_summary and "**Total**" in line:
                  break

          # Open PR 謚ｽ蜃ｺ
          open_prs = []
          for line in lines:
              if "| Open |" in line:
                  m = re.search(r'\[#(\d+)\]\((https://github\.com/([^/]+/[^/]+)/pull/(\d+))\)', line)
                  desc_m = re.search(r'\| Open \| (.+?) \|', line)
                  if m:
                      open_prs.append({
                          "num": m.group(1),
                          "url": m.group(2),
                          "repo": m.group(3),
                          "pr": m.group(4),
                          "desc": desc_m.group(1).strip() if desc_m else ""
                      })

          # 蜷Оpen PR縺ｮ譛邨よ峩譁ｰ譌･繧貞叙蠕
          def get_last_activity(repo, pr_num):
              try:
                  result = subprocess.run(
                      ["gh", "pr", "view", pr_num, "--repo", repo,
                       "--json", "updatedAt,comments,reviews",
                       "--jq", ".updatedAt"],
                      capture_output=True, text=True, timeout=30
                  )
                  if result.returncode == 0 and result.stdout.strip():
                      dt = datetime.fromisoformat(result.stdout.strip().replace("Z", "+00:00"))
                      return dt.strftime("%Y-%m-%d")
              except Exception:
                  pass
              return "unknown"

          for pr in open_prs:
              pr["last_update"] = get_last_activity(pr["repo"], pr["pr"])

          # stdout
          print("## OSS Contributions\n")
          for row in summary_rows:
              print(" ", row)
          print(f"\n### Open PRs ({len(open_prs)})")
          for pr in open_prs:
              print(f"  #{pr['num']}: {pr['desc']}  (last update: {pr['last_update']})  {pr['url']}")

          # GitHub Step Summary
          out = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(out, "a", encoding="utf-8") as f:
              f.write("## OSS Contributions\n\n")
              f.write("\n".join(summary_rows) + "\n\n")
              f.write(f"### Open PRs ({len(open_prs)})\n\n")
              if open_prs:
                  f.write("| PR | Description | Last Update |\n|---|---|---|\n")
                  for pr in open_prs:
                      f.write(f"| [#{pr['num']}]({pr['url']}) | {pr['desc']} | {pr['last_update']} |\n")
              else:
                  f.write("_No open PRs._\n")
          EOF


      - name: Close stale fork PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
import subprocess, json

def run(cmd):
    r = subprocess.run(cmd, capture_output=True, text=True, timeout=60)
    return r.stdout.strip() if r.returncode == 0 else None

# upstreamでMergedになったPRのタイトル一覧を取得
readme = open('README.md', encoding='utf-8').read()
import re
merged_titles = set(re.findall(r'\| Merged \| (.+?) \|', readme))

# yasumorishima所有のオープンPRを取得
out = run(['gh', 'search', 'prs', '--author', 'yasumorishima', '--state', 'open',
           '--json', 'repository,number,title,url'])
if not out:
    print('No open PRs found')
    exit(0)

prs = json.loads(out)
for pr in prs:
    repo = pr['repository']['nameWithOwner']
    # フォーク（yasumorishima/xxx）のみ対象
    if not repo.startswith('yasumorishima/'):
        continue
    title = pr['title']
    # タイトルがupstreamのMerged PRと一致する場合はクローズ
    if title in merged_titles:
        print(f'Closing stale fork PR: {repo}#{pr["number"]} - {title}')
        run(['gh', 'pr', 'close', str(pr['number']), '--repo', repo,
             '--comment', 'Auto-closing: corresponding upstream PR has been merged.'])
    else:
        print(f'Keeping: {repo}#{pr["number"]} - {title}')
PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Auto-refresh PR statuses"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Sync totals to claude-config CLAUDE.md
        if: ${{ env.HAS_PAT == 'true' }}
        env:
          HAS_PAT: ${{ secrets.CLAUDE_CONFIG_PAT != '' }}
          GH_TOKEN: ${{ secrets.CLAUDE_CONFIG_PAT }}
        run: |
          # README.md縺ｮTotal陦後°繧臼R謨ｰ繝ｻMerged謨ｰ繧呈歓蜃ｺ
          TOTAL_LINE=$(grep '**Total**' README.md)
          TOTAL_PRS=$(echo "$TOTAL_LINE" | grep -oP '\*\*\K\d+(?=\*\*)' | head -1)
          TOTAL_MERGED=$(echo "$TOTAL_LINE" | grep -oP '\*\*\K\d+(?=\*\*)' | sed -n '2p')

          if [ -z "$TOTAL_PRS" ] || [ -z "$TOTAL_MERGED" ]; then
            echo "::warning::Failed to extract totals from README.md"
            exit 0
          fi
          echo "Extracted: ${TOTAL_PRS} PRs, ${TOTAL_MERGED} Merged"

          # claude-config縺ｮCLAUDE.md繧貞叙蠕励�譖ｴ譁ｰ
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/yasumorishima/claude-config.git /tmp/claude-config
          cd /tmp/claude-config

          sed -i -E "s|oss-contributions��0-9]+莉ｶ縲ー0-9]+ Merged�榎oss-contributions�${TOTAL_PRS}莉ｶ縲${TOTAL_MERGED} Merged�榎g" CLAUDE.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync OSS totals: ${TOTAL_PRS} PRs, ${TOTAL_MERGED} Merged"
            git push
            echo "claude-config updated: ${TOTAL_PRS} PRs, ${TOTAL_MERGED} Merged"
          else
            echo "claude-config already up to date."
          fi


