name: Refresh Contributions

on:
  schedule:
    - cron: '0 9 * * 1'  # 毎週月曜 9:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh PR statuses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/record_pr.py --refresh

      - name: Write summary
        run: |
          python3 - <<'EOF'
          import re, os
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          lines = readme.splitlines()

          # サマリーテーブル抽出
          summary_rows = []
          in_summary = False
          for line in lines:
              if "| Project |" in line:
                  in_summary = True
              if in_summary:
                  summary_rows.append(line)
              if in_summary and "**Total**" in line:
                  break

          # Open PR 抽出
          open_prs = []
          for line in lines:
              if "| Open |" in line:
                  m = re.search(r'\[#(\d+)\]\((https://github\.com/[^)]+)\)', line)
                  desc_m = re.search(r'\| Open \| (.+?) \|', line)
                  if m:
                      open_prs.append((m.group(1), m.group(2), desc_m.group(1).strip() if desc_m else ""))

          # stdout
          print("## OSS Contributions\n")
          for row in summary_rows:
              print(" ", row)
          print(f"\n### Open PRs ({len(open_prs)})")
          for num, url, desc in open_prs:
              print(f"  #{num}: {desc}  {url}")

          # GitHub Step Summary
          out = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(out, "a", encoding="utf-8") as f:
              f.write("## OSS Contributions\n\n")
              f.write("\n".join(summary_rows) + "\n\n")
              f.write(f"### Open PRs ({len(open_prs)})\n\n")
              if open_prs:
                  f.write("| PR | Description |\n|---|---|\n")
                  for num, url, desc in open_prs:
                      f.write(f"| [#{num}]({url}) | {desc} |\n")
              else:
                  f.write("_No open PRs._\n")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Auto-refresh PR statuses"
            git push
          else
            echo "No changes to commit."
          fi
