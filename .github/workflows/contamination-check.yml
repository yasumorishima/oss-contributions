name: Contamination Check

on:
  workflow_dispatch:
    inputs:
      fork_repo:
        description: 'Fork repo (e.g. yasumorishima/optuna)'
        required: true
      fork_branch:
        description: 'Fork branch to check'
        required: true
      upstream_repo:
        description: 'Upstream repo (e.g. optuna/optuna)'
        required: true
      upstream_branch:
        description: 'Upstream base branch (master or main)'
        required: false
        default: 'master'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clone fork
        run: |
          git clone --depth=100 \
            https://github.com/${{ inputs.fork_repo }}.git repo
          cd repo
          git checkout ${{ inputs.fork_branch }}

      - name: Fetch upstream
        run: |
          cd repo
          git remote add upstream \
            https://github.com/${{ inputs.upstream_repo }}.git
          git fetch upstream ${{ inputs.upstream_branch }}

      - name: List changed files
        run: |
          cd repo
          echo "=== Files changed vs upstream/${{ inputs.upstream_branch }} ==="
          git diff upstream/${{ inputs.upstream_branch }}...HEAD --name-only

      - name: Contamination check
        run: |
          cd repo
          FORK_ONLY=(
            ".coderabbit.yaml"
            ".github/workflows/codeql.yml"
          )
          CHANGED=$(git diff upstream/${{ inputs.upstream_branch }}...HEAD --name-only)
          FAIL=false

          echo "=== Checking for fork-only files ==="
          for f in "${FORK_ONLY[@]}"; do
            if echo "$CHANGED" | grep -qxF "$f"; then
              echo "::error::CONTAMINATION DETECTED: $f"
              FAIL=true
            fi
          done

          if [ "$FAIL" = true ]; then
            echo ""
            echo "❌ Fork-only files are in the diff. Do NOT submit upstream PR."
            exit 1
          fi
          echo "✅ No contamination detected. Safe to submit upstream PR."
