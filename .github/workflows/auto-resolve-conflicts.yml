name: Auto-resolve PR conflicts

# Brings long-lived fork PRs back to MERGEABLE when upstream moves under them (scripts/auto_resolve.py).
# Only conflict shapes already resolved by hand the same way several times are handled; the merge is
# built by the fork's CI on a candidate branch before it reaches the PR branch. Anything else opens
# a tracker issue and pushes nothing.

on:
  schedule:
    - cron: '17 1 * * *'  # daily JST 10:17
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図'
        required: false
        type: string
      project:
        description: 'Which PR (a dry run needs one project)'
        required: false
        type: choice
        options: [all, gyroflow, d2]
        default: all
      dry_run:
        description: 'Never push to the PR branch (test a past merge)'
        required: false
        type: boolean
        default: false
      start_sha:
        description: 'dry run: PR head to start from'
        required: false
        type: string
      upstream_sha:
        description: 'dry run: upstream commit to merge'
        required: false
        type: string
      expect_tree_of:
        description: 'dry run: fail unless the result has this commit tree'
        required: false
        type: string

concurrency:
  group: auto-resolve-conflicts
  cancel-in-progress: false

permissions:
  contents: read
  actions: read  # earlier runs, to count transient stops in a row
  checks: read   # their warning annotations

jobs:
  gyroflow:
    if: github.event_name == 'schedule' || inputs.project != 'd2'
    runs-on: ubuntu-24.04  # ubuntu-latest moves to 26 on 2026-10-19; cargo must be preinstalled
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - name: Resolve gyroflow#1143
        env:
          GH_TOKEN: ${{ secrets.FORK_ADMIN_PAT }}
          TRACKER_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROJECT: ${{ inputs.project }}
          START_SHA: ${{ inputs.start_sha }}
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
          EXPECT_TREE_OF: ${{ inputs.expect_tree_of }}
        run: |
          gh auth setup-git
          args=(gyroflow)
          if [ "$DRY_RUN" = "true" ]; then
            [ "$PROJECT" = "gyroflow" ] || { echo "::error::a dry run needs project=gyroflow or d2"; exit 1; }
            args+=(--dry-run --start-sha "$START_SHA")
            [ -n "$UPSTREAM_SHA" ] && args+=(--upstream-sha "$UPSTREAM_SHA")
            [ -n "$EXPECT_TREE_OF" ] && args+=(--expect-tree-of "$EXPECT_TREE_OF")
          fi
          cargo --version
          python3 scripts/auto_resolve.py "${args[@]}"

  d2:
    if: github.event_name == 'schedule' || inputs.project != 'gyroflow'
    runs-on: ubuntu-24.04  # ubuntu-latest moves to 26 on 2026-10-19; cargo must be preinstalled
    timeout-minutes: 170
    # D2_SIGNING_KEY is an environment secret: only jobs on main that name this environment see it.
    # It is an SSH key used for nothing but signing these merge commits (d2 requires signed commits).
    environment: d2-signing
    steps:
      - uses: actions/checkout@v4

      - name: Resolve d2#2742
        env:
          GH_TOKEN: ${{ secrets.FORK_ADMIN_PAT }}
          TRACKER_TOKEN: ${{ github.token }}
          D2_SIGNING_KEY: ${{ secrets.D2_SIGNING_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROJECT: ${{ inputs.project }}
          START_SHA: ${{ inputs.start_sha }}
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
          EXPECT_TREE_OF: ${{ inputs.expect_tree_of }}
        run: |
          gh auth setup-git
          args=(d2)
          if [ "$DRY_RUN" = "true" ]; then
            [ "$PROJECT" = "d2" ] || { echo "::error::a dry run needs project=gyroflow or d2"; exit 1; }
            args+=(--dry-run --start-sha "$START_SHA")
            [ -n "$UPSTREAM_SHA" ] && args+=(--upstream-sha "$UPSTREAM_SHA")
            [ -n "$EXPECT_TREE_OF" ] && args+=(--expect-tree-of "$EXPECT_TREE_OF")
          fi
          export SIGNING_KEY_FILE="$RUNNER_TEMP/d2-signing-key"
          (umask 077 && printf '%s\n' "$D2_SIGNING_KEY" > "$SIGNING_KEY_FILE")
          trap 'rm -f "$SIGNING_KEY_FILE"' EXIT
          python3 scripts/auto_resolve.py "${args[@]}"
