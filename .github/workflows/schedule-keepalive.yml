name: Scheduled Workflow Keepalive

# GitHub は 60 日間リポジトリに push が無いと scheduled workflow を自動停止する。
# HF や外部サービスへ書くだけでリポジトリに commit しないジョブは、正常に動いていても
# timer が減らないので、ある日いきなり黙って止まる（2026-08-25 mlb-data-pipeline で発生）。
# ここで全自リポを定期的に掃いて enable を打ち直し、timer をリセットする。
#
# - 対象は fork でない自分のリポジトリのみ（fork の schedule は「無効化する」のが方針）
# - 最終 push が STALE_DAYS より前のものだけ（活発なリポは push 自体が timer をリセットする）
# - disabled_manually は意図的な停止なので絶対に触らない
# - 既に disabled_inactivity のものは、捨てた可能性があるので自動では戻さず報告だけ

on:
  schedule:
    - cron: '0 4 * * 0'  # 毎週日曜 UTC 04:00 (JST 13:00)
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図'
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.FORK_ADMIN_PAT }}
      STALE_DAYS: '30'
    steps:
      - name: Re-assert enabled on scheduled workflows of stale repos
        run: |
          AUTHOR=$(gh api user --jq '.login')
          CUTOFF=$(date -u -d "-${STALE_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          REPOS="$RUNNER_TEMP/stale_repos.txt"
          WFS="$RUNNER_TEMP/wf.txt"
          INACTIVE="$RUNNER_TEMP/inactive.txt"
          : > "$INACTIVE"

          echo "author=$AUTHOR / cutoff=$CUTOFF (最終 push がこれより前のリポジトリが対象)"
          gh repo list "$AUTHOR" --source --no-archived --limit 500 \
            --json nameWithOwner,pushedAt \
            --jq ".[] | select(.pushedAt < \"$CUTOFF\") | .nameWithOwner" > "$REPOS"
          echo "対象リポジトリ $(wc -l < "$REPOS") 件"

          KEPT=0
          FAILED=0
          while read -r REPO; do
            gh api "repos/$REPO/actions/workflows" --paginate \
              --jq '.workflows[] | select(.path | startswith(".github/")) | "\(.state)\t\(.path)"' \
              > "$WFS" 2>/dev/null || continue
            while IFS=$(printf '\t') read -r STATE WFPATH; do
              WF=$(basename "$WFPATH")
              if [ "$STATE" = "active" ]; then
                # 有効なままでも enable を打ち直すと 60 日の timer がリセットされる
                if gh api -X PUT "repos/$REPO/actions/workflows/$WF/enable" > /dev/null 2>&1; then
                  KEPT=$((KEPT + 1))
                else
                  echo "::warning::ENABLE FAILED: $REPO の $WF"
                  FAILED=$((FAILED + 1))
                fi
              elif [ "$STATE" = "disabled_inactivity" ]; then
                echo "::warning::INACTIVITY DISABLED: $REPO の $WF は 60 日無操作で停止済み（自動では戻さない）"
                echo "- \`$REPO\` の \`$WF\`" >> "$INACTIVE"
              fi
              # disabled_manually は意図的な停止なので触らない
            done < "$WFS"
          done < "$REPOS"

          echo "✅ enable を打ち直したワークフロー: $KEPT 件 / 失敗 $FAILED 件"
          {
            echo "## Scheduled Workflow Keepalive"
            echo ""
            echo "- 対象リポジトリ: $(wc -l < "$REPOS") 件（最終 push が ${STALE_DAYS} 日より前）"
            echo "- enable 打ち直し: $KEPT 件（失敗 $FAILED 件）"
            if [ -s "$INACTIVE" ]; then
              echo ""
              echo "### 既に 60 日無操作で停止しているもの（自動では戻していない）"
              cat "$INACTIVE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep this workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/schedule-keepalive.yml/enable"
