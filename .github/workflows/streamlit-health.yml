name: Streamlit Health Check

on:
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図（必須）'
        required: true
        type: string
jobs:
  health:
    runs-on: ubuntu-latest

    steps:
      - name: Check all Streamlit apps
        run: |
          python3 - <<'EOF'
          import urllib.request, os, time

          # Fetch URLs from wbc-scouting's streamlit_apps.txt (single source of truth)
          RAW_URL = "https://raw.githubusercontent.com/yasumorishima/wbc-scouting/main/streamlit_apps.txt"
          req = urllib.request.Request(RAW_URL, headers={"User-Agent": "health-check/1.0"})
          with urllib.request.urlopen(req, timeout=10) as resp:
              txt = resp.read().decode("utf-8")

          APPS = []
          for line in txt.splitlines():
              line = line.strip()
              if line and not line.startswith("#"):
                  # Derive display name from URL slug
                  slug = line.replace("https://", "").replace(".streamlit.app/", "")
                  name = slug.replace("-", " ").title()
                  APPS.append((name, line))

          results = []
          for name, url in APPS:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "health-check/1.0"})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      status = resp.status
              except urllib.error.HTTPError as e:
                  status = e.code
              except Exception as e:
                  status = str(e)[:30]
              icon = "OK" if status == 200 else "NG"
              results.append((icon, name, url, status))
              time.sleep(0.3)

          ok = sum(1 for r in results if r[0] == "OK")
          ng = len(results) - ok

          # stdout
          print(f"## Streamlit Health Check — {ok}/{len(results)} OK\n")
          for icon, name, url, status in results:
              mark = "✅" if icon == "OK" else "⚠️"
              print(f"  {mark} {name:<28} {status}")
          if ng > 0:
              print(f"\n⚠️ {ng} app(s) returned non-200 status.")

          # GitHub Step Summary
          out = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"## Streamlit Health Check — {ok}/{len(results)} OK\n\n")
              f.write("| | App | Status |\n|---|---|---|\n")
              for icon, name, url, status in results:
                  mark = "✅" if icon == "OK" else "⚠️"
                  f.write(f"| {mark} | [{name}]({url}) | {status} |\n")
              if ng > 0:
                  f.write(f"\n> ⚠️ {ng} app(s) returned non-200 status.\n")
          EOF
