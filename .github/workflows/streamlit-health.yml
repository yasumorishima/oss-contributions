name: Streamlit Health Check

on:
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest

    steps:
      - name: Check all Streamlit apps
        run: |
          python3 - <<'EOF'
          import urllib.request, os, time

          APPS = [
              # Core apps
              ("NPB Prediction",          "https://npb-prediction.streamlit.app/"),
              ("MLB Bat Tracking",        "https://yasumorishima-mlb-bat-tracking.streamlit.app/"),
              ("MLB Win Probability",     "https://mlb-wp-engine.streamlit.app/"),
              ("NPB Bayes Projection",    "https://npb-prediction-bayes.streamlit.app/"),
              ("Baseball MLOps",          "https://baseball-mlops.streamlit.app/"),
              # WBC Pool A
              ("WBC PR Batters",          "https://wbc-pr-batters.streamlit.app/"),
              ("WBC PR Pitchers",         "https://wbc-pr-pitchers.streamlit.app/"),
              ("WBC Cuba Batters",        "https://wbc-cuba-batters.streamlit.app/"),
              ("WBC CAN Batters",         "https://wbc-can-batters.streamlit.app/"),
              ("WBC CAN Pitchers",        "https://wbc-can-pitchers.streamlit.app/"),
              ("WBC PAN Batters",         "https://wbc-pan-batters.streamlit.app/"),
              ("WBC PAN Pitchers",        "https://wbc-pan-pitchers.streamlit.app/"),
              ("WBC COL Batters",         "https://wbc-col-batters.streamlit.app/"),
              ("WBC COL Pitchers",        "https://wbc-col-pitchers.streamlit.app/"),
              # WBC Pool B
              ("WBC USA Batters",         "https://wbc-usa-batters.streamlit.app/"),
              ("WBC USA Pitchers",        "https://wbc-usa-pitchers.streamlit.app/"),
              ("WBC MEX Batters",         "https://wbc-mex-batters.streamlit.app/"),
              ("WBC MEX Pitchers",        "https://wbc-mex-pitchers.streamlit.app/"),
              ("WBC ITA Batters",         "https://wbc-ita-batters.streamlit.app/"),
              ("WBC ITA Pitchers",        "https://wbc-ita-pitchers.streamlit.app/"),
              ("WBC GB Batters",          "https://wbc-gb-batters.streamlit.app/"),
              ("WBC GB Pitchers",         "https://wbc-gb-pitchers.streamlit.app/"),
              # WBC Pool C
              ("WBC JPN Batters",         "https://wbc-japan-batters.streamlit.app/"),
              ("WBC JPN Pitchers",        "https://wbc-japan-pitchers.streamlit.app/"),
              ("WBC KOR Batters",         "https://wbc-kor-batters.streamlit.app/"),
              ("WBC KOR Pitchers",        "https://wbc-kor-pitchers.streamlit.app/"),
              ("WBC TWN Batters",         "https://wbc-twn-batters.streamlit.app/"),
              ("WBC AUS Batters",         "https://wbc-aus-batters.streamlit.app/"),
              # WBC Pool D
              ("WBC DR Batters",          "https://wbc-dr-batters.streamlit.app/"),
              ("WBC DR Pitchers",         "https://wbc-dr-pitchers.streamlit.app/"),
              ("WBC VEN Batters",         "https://wbc-venezuela-batters.streamlit.app/"),
              ("WBC VEN Pitchers",        "https://wbc-venezuela-pitchers.streamlit.app/"),
              ("WBC NED Batters",         "https://wbc-ned-batters.streamlit.app/"),
              ("WBC NED Pitchers",        "https://wbc-ned-pitchers.streamlit.app/"),
              ("WBC ISR Batters",         "https://wbc-isr-batters.streamlit.app/"),
              ("WBC ISR Pitchers",        "https://wbc-isr-pitchers.streamlit.app/"),
              ("WBC NIC Batters",         "https://wbc-nic-batters.streamlit.app/"),
          ]

          results = []
          for name, url in APPS:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "health-check/1.0"})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      status = resp.status
              except urllib.error.HTTPError as e:
                  status = e.code
              except Exception as e:
                  status = str(e)[:30]
              icon = "✅" if status == 200 else "⚠️"
              results.append((icon, name, url, status))
              time.sleep(0.3)

          ok = sum(1 for r in results if r[0] == "✅")
          ng = len(results) - ok

          out = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"## Streamlit Health Check — {ok}/{len(results)} OK\n\n")
              f.write("| | App | Status |\n|---|---|---|\n")
              for icon, name, url, status in results:
                  f.write(f"| {icon} | [{name}]({url}) | {status} |\n")
              if ng > 0:
                  f.write(f"\n> ⚠️ {ng} app(s) returned non-200 status.\n")
          EOF
