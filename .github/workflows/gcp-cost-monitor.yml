name: GCP Cost Monitor

on:
  schedule:
    - cron: "0 0 * * *"  # 毎日 UTC 00:00 (JST 09:00)
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図'
        required: false
        type: string

jobs:
  check-costs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-cloud-bigquery

      - name: Setup GCP credentials
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-sa-key.json

      - name: Check BigQuery usage
        id: check
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa-key.json
        run: |
          python3 << 'PYEOF'
          import os, json
          from datetime import datetime, timedelta, timezone
          from google.cloud import bigquery

          client = bigquery.Client(project="data-platform-490901")

          # 過去24時間のクエリ使用量
          q_24h = """
          SELECT
            COUNT(*) AS query_count,
            ROUND(SUM(total_bytes_processed) / POW(1024, 3), 3) AS total_gb_processed,
            ROUND(SUM(total_bytes_billed) / POW(1024, 3), 3) AS total_gb_billed
          FROM `region-us`.INFORMATION_SCHEMA.JOBS
          WHERE creation_time >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 24 HOUR)
            AND job_type = 'QUERY'
            AND state = 'DONE'
          """

          # 今月のクエリ使用量
          q_month = """
          SELECT
            COUNT(*) AS query_count,
            ROUND(SUM(total_bytes_processed) / POW(1024, 3), 3) AS total_gb_processed,
            ROUND(SUM(total_bytes_billed) / POW(1024, 3), 3) AS total_gb_billed
          FROM `region-us`.INFORMATION_SCHEMA.JOBS
          WHERE creation_time >= TIMESTAMP_TRUNC(CURRENT_TIMESTAMP(), MONTH)
            AND job_type = 'QUERY'
            AND state = 'DONE'
          """

          # データセット別ストレージ
          q_storage = """
          SELECT
            table_schema AS dataset,
            COUNT(*) AS tables,
            ROUND(SUM(total_logical_bytes) / POW(1024, 2), 2) AS total_mb
          FROM `region-us`.INFORMATION_SCHEMA.TABLE_STORAGE
          WHERE NOT deleted
          GROUP BY table_schema
          ORDER BY total_mb DESC
          """

          r24 = list(client.query(q_24h).result())[0]
          rm = list(client.query(q_month).result())[0]
          storage = list(client.query(q_storage).result())

          total_storage_mb = sum(r.total_mb for r in storage)
          month_gb = float(rm.total_gb_billed or 0)
          gb_24h = float(r24.total_gb_billed or 0)

          # ペース分析
          now = datetime.now(timezone.utc)
          day_of_month = now.day
          import calendar
          days_in_month = calendar.monthrange(now.year, now.month)[1]
          days_remaining = days_in_month - day_of_month

          # 日次平均ペース（今月の実績ベース）
          daily_avg_gb = month_gb / max(day_of_month, 1)
          projected_gb = month_gb + (daily_avg_gb * days_remaining)

          # プログレスバー生成
          def bar(used, total, width=10):
              pct = min(used / total, 1.0) if total > 0 else 0
              filled = round(pct * width)
              return "█" * filled + "░" * (width - filled) + f" {pct*100:.1f}%"

          query_bar = bar(month_gb, 1000)
          storage_bar = bar(total_storage_mb, 10240)

          # 閾値チェック (無料枠: 1TB/月クエリ, 10GB ストレージ)
          alert = False
          if projected_gb > 800:  # 月末予測が80%超
              alert = True
          if total_storage_mb > 5000:  # 50%超
              alert = True

          # 判定ラベル
          if projected_gb > 800:
              pace_label = "⚠️ 要注意"
          elif projected_gb > 500:
              pace_label = "📊 やや高め"
          else:
              pace_label = "✅ 安全"

          storage_lines = ", ".join(f"{r.dataset} {r.total_mb}MB" for r in storage)

          print(f"Day {day_of_month}/{days_in_month} | 24h: {gb_24h:.1f}GB | Month: {month_gb:.1f}GB | Projected: {projected_gb:.1f}GB | Storage: {total_storage_mb:.1f}MB")

          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write(f"alert={'true' if alert else 'false'}\n")
              f.write(f"month_gb={month_gb}\n")
              f.write(f"storage_mb={total_storage_mb}\n")
              f.write(f"gb_24h={gb_24h}\n")
              f.write(f"daily_avg={daily_avg_gb:.3f}\n")
              f.write(f"projected_gb={projected_gb:.1f}\n")
              f.write(f"query_bar={query_bar}\n")
              f.write(f"storage_bar={storage_bar}\n")
              f.write(f"pace_label={pace_label}\n")
              f.write(f"day_info={day_of_month}/{days_in_month}\n")
              f.write(f"storage_detail={storage_lines}\n")
          PYEOF

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gcp-sa-key.json

      - name: Notify Discord
        if: env.HAS_WEBHOOK == 'true'
        env:
          HAS_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        run: |
          ALERT="${{ steps.check.outputs.alert }}"
          MONTH_GB="${{ steps.check.outputs.month_gb }}"
          STORAGE_MB="${{ steps.check.outputs.storage_mb }}"
          GB_24H="${{ steps.check.outputs.gb_24h }}"
          DAILY_AVG="${{ steps.check.outputs.daily_avg }}"
          PROJECTED="${{ steps.check.outputs.projected_gb }}"
          QUERY_BAR="${{ steps.check.outputs.query_bar }}"
          STORAGE_BAR="${{ steps.check.outputs.storage_bar }}"
          PACE_LABEL="${{ steps.check.outputs.pace_label }}"
          DAY_INFO="${{ steps.check.outputs.day_info }}"
          STORAGE_DETAIL="${{ steps.check.outputs.storage_detail }}"
          MEMO="${{ inputs.memo }}"

          if [ "$ALERT" = "true" ]; then
            COLOR=15158332  # red
            TITLE="⚠️ GCP Cost Alert"
          else
            COLOR=3066993  # green
            TITLE="✅ GCP Daily Cost Report"
          fi

          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"${TITLE}\",
                \"color\": ${COLOR},
                \"fields\": [
                  {\"name\": \"ペース判定\", \"value\": \"${PACE_LABEL}\", \"inline\": true},
                  {\"name\": \"経過日\", \"value\": \"${DAY_INFO}\", \"inline\": true},
                  {\"name\": \"24h使用量\", \"value\": \"${GB_24H} GB\", \"inline\": true},
                  {\"name\": \"クエリ (1TB無料)\", \"value\": \"\`${QUERY_BAR}\`\\n${MONTH_GB} GB → 月末予測 ${PROJECTED} GB\", \"inline\": false},
                  {\"name\": \"ストレージ (10GB無料)\", \"value\": \"\`${STORAGE_BAR}\`\\n${STORAGE_MB} MB\", \"inline\": false},
                  {\"name\": \"内訳\", \"value\": \"${STORAGE_DETAIL}\", \"inline\": false}
                ],
                \"footer\": {\"text\": \"data-platform-490901 | ${MEMO:-daily cron}\"}
              }]
            }"
        continue-on-error: true
