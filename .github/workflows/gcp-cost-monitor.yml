name: GCP Cost Monitor

# 2層のコスト監視をDiscordに日次通知する:
#
#  Layer 1: BigQuery 請求エクスポート → 全GCPサービス横断の実課金検知
#           2026-04-11 に Artifact Registry ¥2 を見逃した事件を受けて追加。
#           INFORMATION_SCHEMA では拾えないAR/Cloud Run/GCS等を全部カバー。
#
#  Layer 2: BigQuery INFORMATION_SCHEMA → BQ使用量のペース分析と月末予測
#           日次平均・月末予測・プログレスバー・データセット別内訳を表示。
#           請求エクスポートに出る前（遅延24h）でも当日の兆候を拾える。

on:
  schedule:
    - cron: "0 0 * * *"  # 毎日 UTC 00:00 (JST 09:00)
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図'
        required: false
        type: string

jobs:
  check-costs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-cloud-bigquery

      - name: Setup GCP credentials
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-sa-key.json

      - name: Check GCP costs (billing export + BQ usage)
        id: check
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa-key.json
          WORKFLOW_MEMO: ${{ inputs.memo }}
        run: |
          python3 << 'PYEOF'
          import os, calendar
          from datetime import datetime, timezone
          from google.cloud import bigquery

          PROJECT = "data-platform-490901"
          BILLING_DATASET = "billing_export"
          client = bigquery.Client(project=PROJECT)

          # ════════════════════════════════════════════════════════
          # Layer 1: 請求エクスポート（全GCPサービス横断）
          # ════════════════════════════════════════════════════════
          billing_state = "unknown"  # ok / setup / stale / unknown
          billing_total_net = 0.0
          billing_total_gross = 0.0
          billing_yday_net = 0.0
          billing_services = []  # list of (name, net, gross)
          billing_hours_stale = None
          billing_note = ""

          tbl_query = f"""
          SELECT table_name
          FROM `{PROJECT}.{BILLING_DATASET}.INFORMATION_SCHEMA.TABLES`
          WHERE table_name LIKE 'gcp_billing_export_v1_%'
          ORDER BY table_name
          LIMIT 1
          """
          try:
              rows = list(client.query(tbl_query).result())
          except Exception as e:
              rows = []
              billing_note = f"billing_export dataset unreachable: {type(e).__name__}"

          if not rows:
              billing_state = "setup"
              if not billing_note:
                  billing_note = "請求エクスポート有効化直後、テーブル未生成。数時間〜24h待ち"
          else:
              tbl = rows[0].table_name
              fqtn = f"`{PROJECT}.{BILLING_DATASET}.{tbl}`"

              fresh_q = f"""
              SELECT
                MAX(export_time) AS latest_export,
                TIMESTAMP_DIFF(CURRENT_TIMESTAMP(), MAX(export_time), HOUR) AS hours_stale
              FROM {fqtn}
              """
              fr = list(client.query(fresh_q).result())[0]
              billing_hours_stale = fr.hours_stale or 999

              if billing_hours_stale > 48:
                  billing_state = "stale"
                  billing_note = f"請求エクスポート最終更新 {billing_hours_stale}h前（閾値48h超）"
              else:
                  billing_state = "ok"
                  cost_q = f"""
                  SELECT
                    service.description AS service,
                    ROUND(SUM(cost), 2) AS gross,
                    ROUND(
                      SUM(cost) + SUM(IFNULL((SELECT SUM(amount) FROM UNNEST(credits)), 0)),
                      2
                    ) AS net
                  FROM {fqtn}
                  WHERE DATE(usage_start_time, 'Asia/Tokyo')
                    BETWEEN DATE_TRUNC(CURRENT_DATE('Asia/Tokyo'), MONTH)
                        AND CURRENT_DATE('Asia/Tokyo')
                  GROUP BY service
                  ORDER BY net DESC, gross DESC
                  """
                  for r in client.query(cost_q).result():
                      net = float(r.net or 0)
                      gross = float(r.gross or 0)
                      if gross == 0 and net == 0:
                          continue
                      billing_services.append((r.service, net, gross))
                      billing_total_net += net
                      billing_total_gross += gross

                  yday_q = f"""
                  SELECT
                    ROUND(
                      SUM(cost) + SUM(IFNULL((SELECT SUM(amount) FROM UNNEST(credits)), 0)),
                      2
                    ) AS net
                  FROM {fqtn}
                  WHERE DATE(usage_start_time, 'Asia/Tokyo')
                        = DATE_SUB(CURRENT_DATE('Asia/Tokyo'), INTERVAL 1 DAY)
                  """
                  billing_yday_net = float((list(client.query(yday_q).result())[0].net) or 0)

          # ════════════════════════════════════════════════════════
          # Layer 2: BigQuery 使用量ペース分析（既存ロジック保持）
          # ════════════════════════════════════════════════════════
          q_24h = """
          SELECT
            COUNT(*) AS query_count,
            ROUND(SUM(total_bytes_billed) / POW(1024, 3), 3) AS total_gb_billed
          FROM `region-us`.INFORMATION_SCHEMA.JOBS
          WHERE creation_time >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 24 HOUR)
            AND job_type = 'QUERY'
            AND state = 'DONE'
          """

          q_month = """
          SELECT
            COUNT(*) AS query_count,
            ROUND(SUM(total_bytes_billed) / POW(1024, 3), 3) AS total_gb_billed
          FROM `region-us`.INFORMATION_SCHEMA.JOBS
          WHERE creation_time >= TIMESTAMP_TRUNC(CURRENT_TIMESTAMP(), MONTH)
            AND job_type = 'QUERY'
            AND state = 'DONE'
          """

          q_storage = """
          SELECT
            table_schema AS dataset,
            ROUND(SUM(total_logical_bytes) / POW(1024, 2), 2) AS total_mb
          FROM `region-us`.INFORMATION_SCHEMA.TABLE_STORAGE
          WHERE NOT deleted
          GROUP BY table_schema
          ORDER BY total_mb DESC
          """

          r24 = list(client.query(q_24h).result())[0]
          rm = list(client.query(q_month).result())[0]
          storage = list(client.query(q_storage).result())

          total_storage_mb = sum(r.total_mb for r in storage)
          month_gb = float(rm.total_gb_billed or 0)
          gb_24h = float(r24.total_gb_billed or 0)

          now = datetime.now(timezone.utc)
          day_of_month = now.day
          days_in_month = calendar.monthrange(now.year, now.month)[1]
          days_remaining = days_in_month - day_of_month

          daily_avg_gb = month_gb / max(day_of_month, 1)
          projected_gb = month_gb + (daily_avg_gb * days_remaining)

          # ════════════════════════════════════════════════════════
          # Layer 3: ストレージ日次スナップショット + 成長トレンド
          # ════════════════════════════════════════════════════════
          # 当日のスナップショットを billing_export.storage_snapshots に idempotent に upsert。
          # 過去14日分を読み、7日移動平均で月末予測を出す。
          snapshot_written = False
          try:
              # 当日分を削除してから挿入（同一日2回実行でも重複しない）
              del_q = f"""
              DELETE FROM `{PROJECT}.{BILLING_DATASET}.storage_snapshots`
              WHERE snapshot_date = CURRENT_DATE('Asia/Tokyo')
              """
              client.query(del_q).result()

              if storage:
                  structs = []
                  for r in storage:
                      size_mb = float(r.total_mb or 0)
                      ds_name = r.dataset.replace("'", "\\'")
                      size_bytes = int(size_mb * 1024 * 1024)
                      structs.append(
                          f"STRUCT('{ds_name}' AS dataset, "
                          f"CAST({size_mb} AS FLOAT64) AS size_mb, "
                          f"CAST({size_bytes} AS INT64) AS size_bytes)"
                      )
                  ins_q = f"""
                  INSERT INTO `{PROJECT}.{BILLING_DATASET}.storage_snapshots`
                    (snapshot_date, dataset, size_mb, tables, size_bytes)
                  SELECT
                    CURRENT_DATE('Asia/Tokyo'),
                    dataset,
                    size_mb,
                    0,
                    size_bytes
                  FROM UNNEST([
                  {",".join(structs)}
                  ])
                  """
                  client.query(ins_q).result()
                  snapshot_written = True
          except Exception as e:
              print(f"Snapshot write failed: {type(e).__name__}: {e}")

          # 過去14日の日次合計を取る（LAGで前日比）
          trend_rows = []
          try:
              trend_q = f"""
              WITH daily AS (
                SELECT
                  snapshot_date,
                  SUM(size_mb) AS total_mb
                FROM `{PROJECT}.{BILLING_DATASET}.storage_snapshots`
                WHERE snapshot_date >= DATE_SUB(CURRENT_DATE('Asia/Tokyo'), INTERVAL 14 DAY)
                GROUP BY snapshot_date
                ORDER BY snapshot_date
              )
              SELECT
                snapshot_date,
                total_mb,
                total_mb - LAG(total_mb) OVER (ORDER BY snapshot_date) AS day_delta_mb
              FROM daily
              ORDER BY snapshot_date
              """
              trend_rows = list(client.query(trend_q).result())
          except Exception as e:
              print(f"Trend query failed: {type(e).__name__}: {e}")

          # 7日移動平均の日次成長量
          storage_7d_avg_growth = 0.0
          recent_deltas = [
              float(r.day_delta_mb) for r in trend_rows[-7:]
              if r.day_delta_mb is not None
          ]
          if recent_deltas:
              storage_7d_avg_growth = sum(recent_deltas) / len(recent_deltas)

          storage_projected_mb = total_storage_mb + (storage_7d_avg_growth * days_remaining)
          trend_days = len(trend_rows)

          def bar(used, total, width=10):
              pct = min(used / total, 1.0) if total > 0 else 0
              filled = round(pct * width)
              return "█" * filled + "░" * (width - filled) + f" {pct*100:.1f}%"

          query_bar = bar(month_gb, 1000)
          storage_bar = bar(total_storage_mb, 10240)

          # BQクエリのペース（月末予測）
          if projected_gb > 800:
              pace_label = "⚠️ 要注意"
          elif projected_gb > 500:
              pace_label = "📊 やや高め"
          else:
              pace_label = "✅ 安全"

          # ストレージのペース（7日成長→月末予測ベース）
          # trend_days<3 はデータ蓄積中扱いで判定不能（グレー）
          if trend_days < 3:
              storage_pace_label = "🆕 蓄積中"
          elif storage_projected_mb > 9500:
              storage_pace_label = "⚠️ 要注意"
          elif storage_projected_mb > 8000:
              storage_pace_label = "📊 やや高め"
          else:
              storage_pace_label = "✅ 安全"

          storage_lines = ", ".join(f"{r.dataset} {r.total_mb}MB" for r in storage)

          # ════════════════════════════════════════════════════════
          # 総合判定
          # ════════════════════════════════════════════════════════
          alert = False
          alert_reasons = []

          if billing_state == "ok" and billing_total_net > 0:
              alert = True
              alert_reasons.append(f"実課金 ¥{billing_total_net:.2f}")
          if billing_state in ("setup", "stale"):
              alert = True
              alert_reasons.append(f"請求監視{billing_state}")
          if projected_gb > 800:
              alert = True
              alert_reasons.append(f"BQクエリ月末予測 {projected_gb:.0f}GB")
          # ストレージ: 実値 >9500MB で赤、成長ペースで月末 >9500MB でも赤（3日以上のデータ必要）
          if total_storage_mb > 9500:
              alert = True
              alert_reasons.append(f"BQストレージ {total_storage_mb:.0f}MB (無料枠残り僅か)")
          elif trend_days >= 3 and storage_projected_mb > 9500:
              alert = True
              alert_reasons.append(f"BQストレージ月末予測 {storage_projected_mb:.0f}MB")

          # タイトル
          if alert:
              if billing_state == "ok" and billing_total_net > 0:
                  title = f"🔴 GCP Cost Alert — 今月 ¥{billing_total_net:.2f}"
              elif billing_state == "setup":
                  title = "⚠️ GCP Cost Monitor — 請求エクスポート反映待ち"
              elif billing_state == "stale":
                  title = f"⚠️ GCP Cost Monitor — データ古い ({billing_hours_stale}h)"
              else:
                  title = "⚠️ GCP Cost Alert"
          else:
              title = "✅ GCP Daily Cost Report — 今月 ¥0"

          # Billing サマリ（description用）
          billing_lines = []
          if billing_state == "ok":
              billing_lines.append(f"**今月課金（net）**: ¥{billing_total_net:.2f}")
              billing_lines.append(f"**今月課金（gross）**: ¥{billing_total_gross:.2f}")
              billing_lines.append(f"**昨日分**: ¥{billing_yday_net:.2f}  |  **データ鮮度**: {billing_hours_stale}h ago")
              if billing_services:
                  billing_lines.append("")
                  billing_lines.append("**サービス別（gross>0）**:")
                  for name, net, gross in billing_services:
                      marker = "🔴" if net > 0 else "⚪"
                      if net > 0:
                          billing_lines.append(f"  {marker} {name}: ¥{net:.2f}")
                      else:
                          billing_lines.append(f"  {marker} {name}: ¥0 (gross ¥{gross:.2f} / 無料枠内)")
              else:
                  billing_lines.append("全サービス無料枠内")
          else:
              billing_lines.append(f"⚠️ {billing_note}")

          billing_summary = "\n".join(billing_lines)

          print(f"ALERT: {alert} / reasons: {alert_reasons}")
          print(f"TITLE: {title}")
          print("--- billing summary ---")
          print(billing_summary)
          print(f"--- BQ pace --- Day {day_of_month}/{days_in_month} | 24h: {gb_24h:.1f}GB | Month: {month_gb:.1f}GB | Projected: {projected_gb:.1f}GB")
          print(f"--- Storage --- Current: {total_storage_mb:.1f}MB | 7d avg growth: {storage_7d_avg_growth:+.1f}MB/day | Month-end projection: {storage_projected_mb:.1f}MB | Trend days: {trend_days} | Snapshot written: {snapshot_written}")

          # ── Discord ペイロードを完成形で組み立てる（shell注入回避） ──
          import json
          memo_raw = os.environ.get("WORKFLOW_MEMO", "") or "daily cron"

          if alert:
              if billing_state in ("setup", "stale"):
                  color = 16776960  # yellow
              else:
                  color = 15158332  # red
          else:
              color = 3066993  # green

          query_field_value = (
              f"`{query_bar}`\n{month_gb} GB → 月末予測 {projected_gb:.1f} GB "
              f"/ 24h: {gb_24h} GB"
          )
          storage_field_value = (
              f"`{storage_bar}`\n{total_storage_mb:.1f} MB → "
              f"月末予測 {storage_projected_mb:.1f} MB "
              f"(7日平均 {storage_7d_avg_growth:+.1f} MB/day, trend {trend_days}d)"
          )

          payload = {
              "embeds": [{
                  "title": title,
                  "description": billing_summary or "(no billing data)",
                  "color": color,
                  "fields": [
                      {"name": "クエリペース", "value": pace_label, "inline": True},
                      {"name": "ストレージペース", "value": storage_pace_label, "inline": True},
                      {"name": "経過日", "value": f"{day_of_month}/{days_in_month}", "inline": True},
                      {"name": "クエリ (1TB無料)", "value": query_field_value, "inline": False},
                      {"name": "ストレージ (10GB無料)", "value": storage_field_value, "inline": False},
                      {"name": "BQ内訳", "value": storage_lines or "(empty)", "inline": False},
                  ],
                  "footer": {"text": f"data-platform-490901 | {memo_raw}"},
              }]
          }
          payload_json = json.dumps(payload, ensure_ascii=False)

          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write(f"alert={'true' if alert else 'false'}\n")
              f.write(f"billing_state={billing_state}\n")
              f.write(f"payload<<PAYEOF\n{payload_json}\nPAYEOF\n")
          PYEOF

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gcp-sa-key.json

      - name: Notify Discord
        if: env.HAS_WEBHOOK == 'true'
        env:
          HAS_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAYLOAD: ${{ steps.check.outputs.payload }}
        run: |
          # --fail-with-body: HTTP 4xx/5xx で非0終了。出力にレスポンス本文も含まれる
          # --show-error: エラー詳細を表示
          # continue-on-error は外してあるので、失敗時は on-failure ハンドラが発火
          printf '%s' "$PAYLOAD" | curl --fail-with-body --silent --show-error \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data-binary @-

      - name: Notify Discord on failure
        if: failure() && env.HAS_WEBHOOK == 'true'
        env:
          HAS_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # on-failure 通知。これも失敗したらワークフロー全体が失敗のまま → GitHub が障害メール送信
          python3 -c "
          import json, os, urllib.request
          payload = {
              'embeds': [{
                  'title': '🔥 GCP Cost Monitor ワークフロー失敗',
                  'description': f\"Run: {os.environ['RUN_URL']}\",
                  'color': 15158332,
              }]
          }
          req = urllib.request.Request(
              os.environ['WEBHOOK_URL'],
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(req) as resp:
              print(f'status={resp.status}')
          "
