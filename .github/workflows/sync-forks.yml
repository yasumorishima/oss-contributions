name: Sync Forks

# Requires secret: GH_PAT (classic token with repo scope)
# Manual trigger only — never runs automatically
# Fork list is read from config.json (SSOT)

on:
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図（必須）'
        required: true
        type: string
      repo:
        description: 'Sync specific repo only (name only, e.g. optuna). Leave empty for all.'
        required: false

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Sync forks from config.json
        run: |
          AUTHOR=$(jq -r '.author' config.json)
          FILTER="${{ inputs.repo }}"
          SUCCESS=0
          FAILED=0

          while read upstream; do
            REPO_NAME=$(echo "$upstream" | cut -d/ -f2)
            FORK="$AUTHOR/$REPO_NAME"

            if [ -n "$FILTER" ] && [ "$REPO_NAME" != "$FILTER" ]; then
              echo "⏩ Skipping $FORK"
              continue
            fi

            echo "🔄 Syncing $FORK ← $upstream ..."
            if gh repo sync "$FORK" --source "$upstream" 2>&1; then
              echo "✅ $FORK synced"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "::warning::❌ Sync failed for $FORK (diverged — manual rebase needed)"
              FAILED=$((FAILED + 1))
            fi
            echo ""
          done < <(jq -r '.projects | keys[]' config.json)

          echo "=== Summary ==="
          echo "✅ Succeeded: $SUCCESS"
          echo "❌ Failed:    $FAILED"
          [ "$FAILED" -eq 0 ] || exit 1
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Ensure CodeQL Default Setup on all forks
        run: |
          AUTHOR=$(jq -r '.author' config.json)
          FILTER="${{ inputs.repo }}"
          ENABLED=0
          ALREADY=0

          while read upstream; do
            REPO_NAME=$(echo "$upstream" | cut -d/ -f2)
            FORK="$AUTHOR/$REPO_NAME"

            if [ -n "$FILTER" ] && [ "$REPO_NAME" != "$FILTER" ]; then
              continue
            fi

            STATE=$(gh api "repos/$FORK/code-scanning/default-setup" --jq '.state' 2>/dev/null || echo "error")

            if [ "$STATE" = "configured" ]; then
              ALREADY=$((ALREADY + 1))
            else
              echo "🔧 Enabling CodeQL on $FORK ..."
              if gh api "repos/$FORK/code-scanning/default-setup" -X PATCH -f state=configured >/dev/null 2>&1; then
                echo "✅ CodeQL enabled on $FORK"
                ENABLED=$((ENABLED + 1))
              else
                echo "::warning::❌ Failed to enable CodeQL on $FORK"
              fi
            fi
          done < <(jq -r '.projects | keys[]' config.json)

          echo "=== CodeQL Summary ==="
          echo "✅ Newly enabled: $ENABLED"
          echo "⏩ Already configured: $ALREADY"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
