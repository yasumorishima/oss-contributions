name: Sync Forks

# Requires secret: GH_PAT
# Classic token with repo scope, or fine-grained with contents:write for each fork repo

on:
  schedule:
    - cron: '0 1 * * 1'  # Every Monday 01:00 UTC
  workflow_dispatch:
    inputs:
      repo:
        description: 'Sync specific repo only (name only, e.g. optuna). Leave empty for all.'
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync active OSS forks
        run: |
          declare -A FORKS=(
            ["optuna"]="optuna/optuna"
            ["marumie"]="team-mirai/marumie"
            ["icp-js-core"]="dfinity/icp-js-core"
            ["icp-js-canisters"]="dfinity/icp-js-canisters"
            ["line-bot-mcp-server"]="line/line-bot-mcp-server"
            ["ezc3d"]="pyomeca/ezc3d"
            ["post-checker"]="team-mirai-volunteer/post-checker"
            ["kouchou-ai"]="digitaldemocracy2030/kouchou-ai"
          )

          FILTER="${{ inputs.repo }}"
          SUCCESS=0
          FAILED=0

          for name in "${!FORKS[@]}"; do
            upstream="${FORKS[$name]}"
            fork="yasumorishima/${name}"

            if [ -n "$FILTER" ] && [ "$name" != "$FILTER" ]; then
              echo "⏩ Skipping $fork"
              continue
            fi

            echo "🔄 Syncing $fork ← $upstream ..."
            if gh repo sync "$fork" --source "$upstream" 2>&1; then
              echo "✅ $fork synced"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "::warning::❌ Sync failed for $fork (diverged — manual rebase needed)"
              FAILED=$((FAILED + 1))
            fi
            echo ""
          done

          echo "=== Summary ==="
          echo "✅ Succeeded: $SUCCESS"
          echo "❌ Failed:    $FAILED"
          [ "$FAILED" -eq 0 ] || exit 1
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
