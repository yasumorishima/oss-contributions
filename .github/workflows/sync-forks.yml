name: Sync Forks

# Requires secret: GH_PAT (classic token with repo scope)
# Manual trigger only — never runs automatically
# Fork list is read from config.json (SSOT)

on:
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図（必須）'
        required: true
        type: string
      repo:
        description: 'Sync specific repo only (name only, e.g. optuna). Leave empty for all.'
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync forks from config.json
        run: |
          AUTHOR=$(jq -r '.author' config.json)
          FILTER="${{ inputs.repo }}"
          SUCCESS=0
          FAILED=0

          while read upstream; do
            REPO_NAME=$(echo "$upstream" | cut -d/ -f2)
            FORK="$AUTHOR/$REPO_NAME"

            if [ -n "$FILTER" ] && [ "$REPO_NAME" != "$FILTER" ]; then
              echo "⏩ Skipping $FORK"
              continue
            fi

            echo "🔄 Syncing $FORK ← $upstream ..."
            if gh repo sync "$FORK" --source "$upstream" 2>&1; then
              echo "✅ $FORK synced"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "::warning::❌ Sync failed for $FORK (diverged — manual rebase needed)"
              FAILED=$((FAILED + 1))
            fi
            echo ""
          done < <(jq -r '.projects | keys[]' config.json)

          echo "=== Summary ==="
          echo "✅ Succeeded: $SUCCESS"
          echo "❌ Failed:    $FAILED"
          [ "$FAILED" -eq 0 ] || exit 1
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
